spring.application.name=SkyBooking

# ===============================
# Servidor
# ===============================
server.port=8080

# ===============================
# Base de Datos MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/skybooking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=skyuser
spring.datasource.password=skypass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===============================
# Spring Security
# ====== CONFIGURACI�N JWT ======
# Clave secreta en Base64 (m�nimo 256 bits para HS256)
app.jwt.secret=Q29tb01pbmltbzEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==
# Tiempo de expiraci�n del token (24 horas en milisegundos)
app.jwt.expiration=86400000
# ===== CONFIGURACI�N DE SESI�N WEB =====
server.servlet.session.timeout=30m