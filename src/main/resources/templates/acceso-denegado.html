<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado - SkyBooking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments :: header"></div>

<div class="container text-center py-5">
    <h1 class="display-5 text-danger">403 · Acceso denegado</h1>
    <p class="lead text-muted">No tienes permisos para acceder a esta sección.</p>

    <div class="mt-4">
        <a th:href="@{/web/dashboard}" class="btn btn-primary me-2">Volver al dashboard</a>
        <form th:action="@{/logout}" method="post" style="display:inline-block;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
        </form>
    </div>
</div>

<div th:replace="fragments :: footer"></div>
</body>
</html>
