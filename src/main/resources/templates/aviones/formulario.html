<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${avion.id == null} ? 'Nuevo Avión' : 'Editar Avión'">Formulario de Avión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; }
        .container {
            max-width: 600px;
            margin: 3rem auto;
            background-color: #fff;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; color: #0d6efd; font-weight: 700; margin-bottom: 0.5rem; }
        p { text-align: center; color: #6c757d; margin-bottom: 2rem; }
        .form-label { font-weight: 600; }
        .form-control {
            border-radius: 0.5rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ced4da;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.25);
        }
        .text-danger { font-size: 0.85rem; margin-top: 0.25rem; }
        .btn-primary, .btn-secondary { width: 100%; font-weight: 600; border-radius: 0.5rem; margin-top: 0.5rem; }
        .btn-primary { background-color: #0d6efd; border: none; }
        .btn-primary:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="${avion.id == null} ? 'Nuevo Avión' : 'Editar Avión'">Nuevo Avión</h2>
    <p>Completa los datos del avión</p>

    <form th:action="@{/web/aviones/guardar}" th:object="${avion}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Matrícula</label>
            <input type="text" class="form-control" th:field="*{matricula}" placeholder="Ej: EC1234">
            <div class="text-danger" th:errors="*{matricula}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Modelo</label>
            <input type="text" class="form-control" th:field="*{modelo}" placeholder="Ej: Airbus A320">
            <div class="text-danger" th:errors="*{modelo}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Capacidad Turista</label>
                <input type="number" class="form-control" th:field="*{capacidadTurista}" placeholder="Ej: 150">
                <div class="text-danger" th:errors="*{capacidadTurista}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Capacidad Business</label>
                <input type="number" class="form-control" th:field="*{capacidadBusiness}" placeholder="Ej: 20">
                <div class="text-danger" th:errors="*{capacidadBusiness}"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary"><i class="bi bi-save-fill"></i> Guardar</button>
        <a th:href="@{/web/aviones}" class="btn btn-secondary"><i class="bi bi-x-circle-fill"></i> Cancelar</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
