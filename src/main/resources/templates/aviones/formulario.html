<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Avión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 th:text="${avion.id == null} ? 'Nuevo Avión' : 'Editar Avión'"></h2>
    <p class="text-muted">Introduce los datos del avión y su capacidad.</p>

    <form th:action="@{/web/aviones/guardar}" th:object="${avion}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Matrícula</label>
            <input type="text" class="form-control" th:field="*{matricula}">
            <div class="text-danger" th:errors="*{matricula}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Modelo</label>
            <input type="text" class="form-control" th:field="*{modelo}">
            <div class="text-danger" th:errors="*{modelo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacidad Turista</label>
            <input type="number" class="form-control" min="1" th:field="*{capacidadTurista}">
            <div class="text-danger" th:errors="*{capacidadTurista}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacidad Business</label>
            <input type="number" class="form-control" min="0" th:field="*{capacidadBusiness}">
            <div class="text-danger" th:errors="*{capacidadBusiness}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/web/aviones}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
