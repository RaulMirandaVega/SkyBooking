<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Header fragment -->
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary" th:href="@{/}">
                <i class="bi bi-airplane-engines-fill fs-4"></i>
                <span>SkyBooking</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:href="@{/web/vuelos}">Vuelos</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','EMPLEADO')"><a class="nav-link" th:href="@{/web/reservas}">Reservas</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','EMPLEADO')"><a class="nav-link" th:href="@{/web/pasajeros}">Pasajeros</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/web/aviones}">Aviones</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <div class="d-none d-md-block text-end">
                        <div class="small text-muted">Conectado como</div>
                        <div class="fw-semibold text-primary" sec:authentication="name">Usuario</div>
                    </div>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="d-none d-md-inline">Salir</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>

<!-- Footer fragment -->
<footer th:fragment="footer" class="mt-auto py-4 bg-light text-muted">
    <div class="container text-center small">
        &copy; <span th:text="${T(java.time.Year).now().value}"></span> SkyBooking · Todos los derechos reservados
    </div>
</footer>

</body>
</html>
