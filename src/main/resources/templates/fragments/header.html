<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-sky py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" th:href="@{/web/dashboard}">
                <i class="bi bi-airplane-engines-fill"></i> SkyBooking
            </a>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/aviones}">Aviones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/vuelos}">Vuelos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/reservas}">Reservas</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="nav-link text-danger" th:href="@{/web/pasajeros}">Pasajeros</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                    <div class="user-box me-3">
                        <span class="ms-1 fw-bold" sec:authentication="name">Usuario</span>
                        <span sec:authorize="hasRole('ROLE_ADMIN')" class="role-badge bg-danger text-white">ADMIN</span>
                        <span sec:authorize="hasRole('ROLE_EMPLEADO')" class="role-badge bg-primary text-white">EMPLEADO</span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-power"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
