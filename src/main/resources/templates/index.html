<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>SkyBooking - Panel Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom, #f0f4f8, #ffffff);
            font-family: 'Poppins', sans-serif;
        }

        .header-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-title h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #0d6efd;
        }

        .header-title p {
            color: #495057;
            font-size: 1.1rem;
        }

        /* Tarjetas uniformes */
        .menu-card {
            border-radius: 1rem;
            padding: 2rem 1rem;
            text-align: center;
            background: #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: transform .2s, box-shadow .2s;

            /* 🔥 Fuerza el mismo tamaño para todas */
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .menu-card i {
            font-size: 2.5rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }

        .menu-card h5 {
            font-weight: 700;
            margin-bottom: .5rem;
        }

        .menu-card p {
            color: #6c757d;
            font-size: .9rem;
            margin-bottom: 1.2rem;
        }

        .btn-main {
            border-radius: 20px;
            padding: .5rem 1.5rem;
        }
    </style>
</head>

<body>
<div class="container py-5">

    <div class="header-title">
        <h1>✈ SkyBooking</h1>
        <p>Panel de administración del sistema</p>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-6 col-md-3">
            <div class="menu-card">
                <div>
                    <i class="bi bi-airplane-fill"></i>
                    <h5>Vuelos</h5>
                    <p>Gestión de vuelos programados</p>
                </div>
                <a th:href="@{/web/vuelos}" class="btn btn-primary btn-main">Acceder</a>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="menu-card">
                <div>
                    <i class="bi bi-ticket-perforated-fill"></i>
                    <h5>Reservas</h5>
                    <p>Billetes vendidos y gestión</p>
                </div>
                <a th:href="@{/web/reservas}" class="btn btn-primary btn-main">Acceder</a>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="menu-card">
                <div>
                    <i class="bi bi-people-fill"></i>
                    <h5>Pasajeros</h5>
                    <p>Clientes registrados</p>
                </div>
                <a th:href="@{/web/pasajeros}" class="btn btn-primary btn-main">Acceder</a>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="menu-card">
                <div>
                    <i class="bi bi-building-fill"></i>
                    <h5>Aviones</h5>
                    <p>Flota disponible</p>
                </div>
                <a th:href="@{/web/aviones}" class="btn btn-primary btn-main">Acceder</a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
