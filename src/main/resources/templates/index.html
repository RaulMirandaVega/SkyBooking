<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SkyBooking - Panel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">✈ SkyBooking</h1>
    <p class="text-center text-muted mb-5">Panel de administración del sistema</p>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Vuelos</h5>
                    <p class="card-text">Gestión de vuelos</p>
                    <a th:href="@{/web/vuelos}" class="btn btn-primary">Acceder</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Reservas</h5>
                    <p class="card-text">Billetes vendidos</p>
                    <a th:href="@{/web/reservas}" class="btn btn-primary">Acceder</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Pasajeros</h5>
                    <p class="card-text">Clientes registrados</p>
                    <a th:href="@{/web/pasajeros}" class="btn btn-primary">Acceder</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Aviones</h5>
                    <p class="card-text">Flota disponible</p>
                    <a th:href="@{/web/aviones}" class="btn btn-primary">Acceder</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
