<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - SkyBooking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .login-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .brand-title {
            text-align: center;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        /* --- ESTILOS CORREGIDOS PARA FUSIONAR ICONO E INPUT --- */

        /* El contenedor del icono (izquierda) */
        .input-group-text {
            background-color: #fff;       /* Fondo blanco para que coincida con el input */
            border-right: none;           /* Quitamos la línea divisoria derecha */
            border-top-left-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
            color: #6c757d;               /* Color del icono gris suave */
        }

        /* El campo de texto (derecha) */
        .form-control {
            border-left: none;            /* Quitamos la línea divisoria izquierda */
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            /* IMPORTANTE: Forzamos esquinas cuadradas a la izquierda para pegar con el icono */
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            padding: 0.75rem;
        }

        /* Efecto al hacer clic (Focus) para que no se vea raro */
        .form-control:focus {
            box-shadow: none;             /* Quitamos la sombra azul por defecto de Bootstrap */
            border-color: #dee2e6;        /* Mantenemos el borde gris */
            border-left: none;            /* Aseguramos que no aparezca borde izquierdo */
        }

        /* Un pequeño truco para que el borde del grupo se ilumine junto */
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #86b7fe;        /* Color azul al hacer foco */
            z-index: 2;
        }
        /* ------------------------------------------------------- */

        .btn-main {
            border-radius: 20px;
            padding: .6rem 1.5rem;
            font-weight: 600;
            width: 100%;
        }

        .alert-custom {
            border-radius: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
    <div class="brand-title">
        <i class="bi bi-airplane-engines"></i> SkyBooking
    </div>

    <div th:if="${param.error}" class="alert alert-danger alert-custom text-center" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i> Usuario o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success alert-custom text-center" role="alert">
        <i class="bi bi-check-circle-fill"></i> Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label text-muted">Usuario</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" name="username" class="form-control" placeholder="Usuario" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label text-muted">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" name="password" class="form-control" placeholder="***" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-main shadow-sm">
            Entrar al Sistema
        </button>
    </form>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left"></i> Volver al inicio
            </a>
        </div>
    </div>
</div>

</body>
</html>
