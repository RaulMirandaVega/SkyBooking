<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Pasajero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
        }

        .container {
            max-width: 600px;
            padding-top: 2.5rem;
            padding-bottom: 2.5rem;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 0.25rem;
        }

        p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 2rem;
        }

        .card-form {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            border-radius: 0.5rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ced4da;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.25);
        }

        .text-danger {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .btn-submit {
            width: 100%;
            font-weight: 600;
            margin-top: 1rem;
        }

        .btn-cancel {
            width: 100%;
            font-weight: 600;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
<div th:replace="fragments :: header"></div>

<div class="container">
    <div class="card-form">
        <h2 th:text="${pasajero.id == null} ? 'Nuevo Pasajero' : 'Editar Pasajero'">Nuevo Pasajero</h2>
        <p>Completa los datos del pasajero</p>

        <form th:action="@{/web/pasajeros/guardar}" th:object="${pasajero}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" placeholder="Introduce el nombre">
                <div class="text-danger" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Apellidos</label>
                <input type="text" class="form-control" th:field="*{apellidos}" placeholder="Introduce los apellidos">
                <div class="text-danger" th:errors="*{apellidos}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" th:field="*{dni}" placeholder="Ej: 12345678A">
                <div class="text-danger" th:errors="*{dni}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="Ej: ejemplo@mail.com">
                <div class="text-danger" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono (opcional)</label>
                <input type="text" class="form-control" th:field="*{telefono}" placeholder="Ej: 612345678">
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                <div class="text-danger" th:errors="*{fechaNacimiento}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">Guardar</button>
            <a th:href="@{/web/pasajeros}" class="btn btn-secondary btn-cancel">Cancelar</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div th:replace="fragments :: footer"></div>
</body>
</html>
