<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Pasajero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 th:text="${pasajero.id == null} ? 'Nuevo Pasajero' : 'Editar Pasajero'"></h2>
    <p class="text-muted">Completa los datos del pasajero.</p>

    <form th:action="@{/web/pasajeros/guardar}" th:object="${pasajero}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}">
            <div class="text-danger" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" th:field="*{apellidos}">
            <div class="text-danger" th:errors="*{apellidos}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">DNI</label>
            <input type="text" class="form-control" th:field="*{dni}">
            <div class="text-danger" th:errors="*{dni}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
            <div class="text-danger" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono (opcional)</label>
            <input type="text" class="form-control" th:field="*{telefono}">
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Nacimiento</label>
            <input type="date" class="form-control" th:field="*{fechaNacimiento}">
            <div class="text-danger" th:errors="*{fechaNacimiento}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/web/pasajeros}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
