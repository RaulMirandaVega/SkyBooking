<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="mb-3">Pasajeros</h2>
    <p class="text-muted">Consulta y administra todos los pasajeros registrados en el sistema.</p>

    <a th:href="@{/web/pasajeros/nuevo}" class="btn btn-success mb-3">Nuevo Pasajero</a>

    <table class="table table-hover table-striped shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>DNI</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Fecha Nacimiento</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pasajeros}">
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.apellidos}"></td>
            <td th:text="${p.dni}"></td>
            <td th:text="${p.email}"></td>
            <td th:text="${p.telefono != null ? p.telefono : '—'}"></td>
            <td th:text="${#temporals.format(p.fechaNacimiento, 'dd/MM/yyyy')}"></td>
            <td>
                <a th:href="@{/web/pasajeros/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/web/pasajeros/eliminar/{id}(id=${p.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar pasajero?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al panel principal</a>
</div>

</body>
</html>
