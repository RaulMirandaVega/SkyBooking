<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 th:text="${reserva.id == null} ? 'Nueva Reserva' : 'Editar Reserva'"></h2>
    <p class="text-muted">Completa los datos de la reserva y confirma.</p>

    <form th:action="@{/web/reservas/guardar}" th:object="${reserva}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Pasajero</label>
            <select class="form-select" th:field="*{pasajeroId}">
                <option value="">-- Selecciona pasajero --</option>
                <option th:each="p : ${pasajeros}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellidos}"></option>
            </select>
            <div class="text-danger" th:errors="*{pasajeroId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Vuelo</label>
            <select class="form-select" th:field="*{vueloId}">
                <option value="">-- Selecciona vuelo --</option>
                <option th:each="v : ${vuelos}" th:value="${v.id}" th:text="${v.numeroVuelo + ' | ' + v.origen + ' → ' + v.destino}"></option>
            </select>
            <div class="text-danger" th:errors="*{vueloId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Clase</label>
            <select class="form-select" th:field="*{clase}">
                <option value="">-- Selecciona clase --</option>
                <option value="TURISTA">Turista</option>
                <option value="BUSINESS">Business</option>
            </select>
            <div class="text-danger" th:errors="*{clase}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Asiento (opcional)</label>
            <input type="text" class="form-control" th:field="*{asiento}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/web/reservas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
