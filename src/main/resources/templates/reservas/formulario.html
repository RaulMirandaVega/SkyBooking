<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${reserva.id == null} ? 'Nueva Reserva' : 'Editar Reserva'">Formulario de Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #f0f4f8, #ffffff);
        }
        .container {
            max-width: 700px;
            margin: 3rem auto;
            background-color: #fff;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 0.5rem;
        }
        p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        .form-label { font-weight: 600; }
        .form-control, .form-select {
            border-radius: 0.5rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ced4da;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.25);
        }
        .text-danger { font-size: 0.85rem; margin-top: 0.25rem; }
        .input-group-text { font-weight: 700; background-color: #e9ecef; border-radius: 0.5rem 0 0 0.5rem; }
        #precioCalculado {
            font-weight: 700;
            font-size: 1.2rem;
            color: #198754;
            background-color: #e9f7ef;
            text-align: center;
            border-radius: 0.5rem;
        }
        .btn-primary {
            width: 100%;
            font-weight: 600;
            background-color: #0d6efd;
            border: none;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-secondary {
            width: 100%;
            font-weight: 600;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }
        .row-gap { gap: 1.25rem; }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <h2 th:text="${reserva.id == null} ? 'Nueva Reserva' : 'Editar Reserva'">Nueva Reserva</h2>
    <p>Completa los datos de la reserva y confirma.</p>

    <form th:action="@{/web/reservas/guardar}" th:object="${reserva}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Pasajero</label>
            <select class="form-select" th:field="*{pasajeroId}">
                <option value="">-- Selecciona pasajero --</option>
                <option th:each="p : ${pasajeros}" th:value="${p.id}"
                        th:text="${p.nombre + ' ' + p.apellidos}"
                        th:selected="${reserva.pasajeroId == p.id}"></option>
            </select>
            <div class="text-danger" th:errors="*{pasajeroId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Vuelo</label>
            <select class="form-select" th:field="*{vueloId}">
                <option value="">-- Selecciona vuelo --</option>
                <option th:each="v : ${vuelos}" th:value="${v.id}"
                        th:data-precio-turista="${v.precioTurista}"
                        th:data-precio-business="${v.precioBusiness}"
                        th:text="${v.numeroVuelo + ' · ' + v.origen + ' → ' + v.destino}"
                        th:selected="${reserva.vueloId == v.id}"></option>
            </select>
            <div class="text-danger" th:errors="*{vueloId}"></div>
        </div>

        <div class="row row-gap">
            <div class="col-md-6 mb-3">
                <label class="form-label">Clase</label>
                <select class="form-select" th:field="*{clase}">
                    <option value="">-- Selecciona clase --</option>
                    <option value="TURISTA" th:selected="${reserva.clase == 'TURISTA'}">Turista</option>
                    <option value="BUSINESS" th:selected="${reserva.clase == 'BUSINESS'}">Business</option>
                </select>
                <div class="text-danger" th:errors="*{clase}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Precio estimado</label>
                <input type="text" id="precioCalculado" class="form-control" readonly
                       th:value="${reserva.precioTotal != null} ? ${#numbers.formatDecimal(reserva.precioTotal,1,'COMMA',2,'POINT')} + ' €' : '— €'">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Asiento (opcional)</label>
            <input type="text" class="form-control" th:field="*{asiento}" placeholder="Ej: 12A">
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
                <option value="">-- Selecciona estado --</option>
                <option value="PENDIENTE" th:selected="${reserva.estado == 'PENDIENTE'}">PENDIENTE</option>
                <option value="CONFIRMADA" th:selected="${reserva.estado == 'CONFIRMADA'}">CONFIRMADA</option>
                <option value="CANCELADA" th:selected="${reserva.estado == 'CANCELADA'}">CANCELADA</option>
            </select>
        </div>

        <div class="mt-4 d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-save-fill"></i> Guardar Reserva
            </button>
            <a th:href="@{/web/reservas}" class="btn btn-secondary btn-lg">
                <i class="bi bi-x-circle-fill"></i> Cancelar
            </a>
        </div>
    </form>
</div>

<script>
    const vueloSelect = document.querySelector('[name="vueloId"]');
    const claseSelect = document.querySelector('[name="clase"]');
    const precioInput = document.getElementById('precioCalculado');

    function calcularPrecio() {
        const vueloOption = vueloSelect.options[vueloSelect.selectedIndex];
        const clase = claseSelect.value;
        if (!vueloOption || !clase) { precioInput.value = '— €'; return; }

        let precio = clase === 'TURISTA' ? vueloOption.dataset.precioTurista
            : clase === 'BUSINESS' ? vueloOption.dataset.precioBusiness
                : null;

        precioInput.value = precio ? parseFloat(precio).toFixed(2) + ' €' : '— €';
    }

    vueloSelect.addEventListener('change', calcularPrecio);
    claseSelect.addEventListener('change', calcularPrecio);
    window.addEventListener('load', calcularPrecio);
</script>

</body>
</html>
