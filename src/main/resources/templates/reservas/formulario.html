<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${reserva.id == null} ? 'Nueva Reserva' : 'Editar Reserva'">Formulario de Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            color: #343a40;
        }
        .container {
            padding-top: 2rem;
            padding-bottom: 2rem;
            max-width: 700px;
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        h2 {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        p {
            color: #6c757d;
            margin-bottom: 2rem;
            text-align: center;
        }
        label {
            font-weight: 600;
        }
        .form-control, .form-select {
            border-radius: 0.5rem;
            padding: 0.6rem 0.75rem;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .btn-secondary {
            border-radius: 0.5rem;
        }
        .helper-text {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        #precioCalculado {
            font-weight: 700;
            font-size: 1.1rem;
            color: #198754;
            background-color: #e9f7ef;
            text-align: center;
        }
    </style>
</head>
<body>
<div th:replace="fragments :: header"></div>

<div class="container">
    <h2 th:text="${reserva.id == null} ? 'Nueva Reserva' : 'Editar Reserva'">Nueva Reserva</h2>
    <p>Completa los datos de la reserva y confirma.</p>

    <form th:action="@{/web/reservas/guardar}" th:object="${reserva}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" th:field="*{id}"/>

        <!-- Pasajero -->
        <div class="mb-3">
            <label class="form-label">Pasajero</label>
            <select class="form-select" th:field="*{pasajeroId}">
                <option value="">-- Selecciona pasajero --</option>
                <option th:each="p : ${pasajeros}" th:value="${p.id}"
                        th:text="${p.nombre + ' ' + p.apellidos}"></option>
            </select>
            <div class="text-danger" th:errors="*{pasajeroId}"></div>
        </div>

        <!-- Vuelo -->
        <div class="mb-3">
            <label class="form-label">Vuelo</label>
            <select class="form-select" th:field="*{vueloId}">
                <option value="">-- Selecciona vuelo --</option>
                <option th:each="v : ${vuelos}" th:value="${v.id}"
                        th:data-precio-turista="${v.precioTurista != null ? v.precioTurista : '0'}"
                        th:data-precio-business="${v.precioBusiness != null ? v.precioBusiness : '0'}"
                        th:text="|${v.numeroVuelo} · ${v.origen} → ${v.destino}|"></option>
            </select>
            <div class="text-danger" th:errors="*{vueloId}"></div>
        </div>

        <!-- Clase y precio -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Clase</label>
                <select class="form-select" th:field="*{clase}">
                    <option value="">-- Selecciona clase --</option>
                    <option th:each="clase : ${clases}" th:value="${clase}" th:text="${clase}"></option>
                </select>
                <div class="text-danger" th:errors="*{clase}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Precio estimado</label>
                <input type="text" id="precioCalculado" class="form-control" readonly placeholder="— €">
                <div class="helper-text">El precio se calcula automáticamente según el vuelo y la clase.</div>
            </div>
        </div>

        <!-- Asiento -->
        <div class="mb-3">
            <label class="form-label">Asiento (opcional)</label>
            <input type="text" class="form-control" th:field="*{asiento}" placeholder="Ej: 12A">
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/web/reservas}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
    const vueloSelect = document.querySelector('[name="vueloId"]');
    const claseSelect = document.querySelector('[name="clase"]');
    const precioInput = document.getElementById('precioCalculado');

    function calcularPrecio() {
        const vueloOption = vueloSelect.options[vueloSelect.selectedIndex];
        const clase = claseSelect.value;

        if (!vueloOption || !clase) {
            precioInput.value = '— €';
            return;
        }

        let precio = null;

        if (clase === 'TURISTA') {
            precio = vueloOption.dataset.precioTurista;
        } else if (clase === 'BUSINESS') {
            precio = vueloOption.dataset.precioBusiness;
        }

        if (precio) {
            precioInput.value = parseFloat(precio).toFixed(2) + ' €';
        } else {
            precioInput.value = '— €';
        }
    }

    vueloSelect.addEventListener('change', calcularPrecio);
    claseSelect.addEventListener('change', calcularPrecio);
</script>

<div th:replace="fragments :: footer"></div>
</body>
</html>
