<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Vuelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <h2 th:text="${vuelo.id == null} ? 'Nuevo Vuelo' : 'Editar Vuelo'"></h2>

    <form th:action="@{/web/vuelos/guardar}" th:object="${vuelo}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Número de Vuelo</label>
            <input type="text" class="form-control"
                   th:field="*{numeroVuelo}"
                   th:classappend="${#fields.hasErrors('numeroVuelo')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:errors="*{numeroVuelo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Origen</label>
            <input type="text" class="form-control" th:field="*{origen}">
        </div>

        <div class="mb-3">
            <label class="form-label">Destino</label>
            <input type="text" class="form-control" th:field="*{destino}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/web/vuelos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
