<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${vuelo.id == null} ? 'Nuevo Vuelo' : 'Editar Vuelo'">Formulario de Vuelo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #f0f4f8, #ffffff);
        }
        .container {
            max-width: 700px;
            margin: 3rem auto;
            background-color: #fff;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            font-weight: 700;
            color: #0d6efd;
        }
        p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        .form-label { font-weight: 600; }
        .row-gap { gap: 1.25rem; }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h2 th:text="${vuelo.id == null} ? 'Nuevo Vuelo' : 'Editar Vuelo'">Nuevo Vuelo</h2>
    <p>Completa los datos del vuelo</p>

    <form th:action="@{/web/vuelos/guardar}" th:object="${vuelo}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Número de Vuelo</label>
            <input type="text" class="form-control" th:field="*{numeroVuelo}" placeholder="Ej: IB3001">
            <span class="text-danger" th:errors="*{numeroVuelo}"></span>
        </div>

        <div class="row row-gap">
            <div class="col-md-6">
                <label class="form-label">Origen</label>
                <input type="text" class="form-control" th:field="*{origen}">
                <span class="text-danger" th:errors="*{origen}"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Destino</label>
                <input type="text" class="form-control" th:field="*{destino}">
                <span class="text-danger" th:errors="*{destino}"></span>
            </div>
        </div>

        <div class="row row-gap mt-3">
            <div class="col-md-6">
                <label class="form-label">Fecha de Salida</label>
                <input type="datetime-local" class="form-control" th:field="*{fechaSalida}">
                <span class="text-danger" th:errors="*{fechaSalida}"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha de Llegada</label>
                <input type="datetime-local" class="form-control" th:field="*{fechaLlegada}">
                <span class="text-danger" th:errors="*{fechaLlegada}"></span>
            </div>
        </div>

        <div class="row row-gap mt-3">
            <div class="col-md-6">
                <label class="form-label">Precio Turista (€)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precioTurista}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Precio Business (€)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precioBusiness}">
            </div>
        </div>

        <div class="row row-gap mt-3">
            <div class="col-md-6">
                <label class="form-label">Avión</label>
                <select class="form-select" th:field="*{avionId}">
                    <option value="">-- Selecciona Avión --</option>
                    <option th:each="avion : ${aviones}"
                            th:value="${avion.id}"
                            th:text="${avion.modelo + ' (' + avion.matricula + ')'}">
                    </option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Estado</label>
                <select class="form-select" th:field="*{estado}">
                    <option value="">-- Selecciona Estado --</option>
                    <option value="PROGRAMADO">PROGRAMADO</option>
                    <option value="EN_VUELO">EN VUELO</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                    <option value="CANCELADO">CANCELADO</option>
                </select>
            </div>
        </div>

        <div class="mt-4 d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-save-fill"></i> Guardar Vuelo
            </button>
            <a th:href="@{/web/vuelos}" class="btn btn-secondary btn-lg">
                <i class="bi bi-x-circle-fill"></i> Cancelar
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
