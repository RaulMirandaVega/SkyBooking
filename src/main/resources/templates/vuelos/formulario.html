<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${vuelo.id == null} ? 'Nuevo Vuelo' : 'Editar Vuelo'">Formulario de Vuelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; }
        .container { padding: 2rem; max-width: 700px; background-color: #fff; border-radius: 1rem; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        h2 { color: #0d6efd; font-weight: 700; text-align: center; margin-bottom: 1rem; }
        label { font-weight: 600; }
        .form-control, .form-select { border-radius: 0.5rem; padding: 0.6rem 0.75rem; }
        .btn-primary { background-color: #0d6efd; border: none; font-weight: 600; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-secondary { border-radius: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${vuelo.id == null} ? 'Nuevo Vuelo' : 'Editar Vuelo'">Nuevo Vuelo</h2>

    <form th:action="@{/web/vuelos/guardar}" th:object="${vuelo}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Número de Vuelo</label>
            <input type="text" class="form-control" th:field="*{numeroVuelo}">
            <span class="text-danger" th:errors="*{numeroVuelo}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Origen</label>
            <input type="text" class="form-control" th:field="*{origen}">
            <span class="text-danger" th:errors="*{origen}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Destino</label>
            <input type="text" class="form-control" th:field="*{destino}">
            <span class="text-danger" th:errors="*{destino}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Salida</label>
            <input type="datetime-local" class="form-control" th:field="*{fechaSalida}">
            <span class="text-danger" th:errors="*{fechaSalida}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Llegada</label>
            <input type="datetime-local" class="form-control" th:field="*{fechaLlegada}">
            <span class="text-danger" th:errors="*{fechaLlegada}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio Turista</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precioTurista}">
        </div>

        <div class="mb-3">
            <label class="form-label">Precio Business</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precioBusiness}">
        </div>

        <div class="mb-3">
            <label class="form-label">Avión</label>
            <input type="number" class="form-control" th:field="*{avionId}">
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
                <option value="">-- Selecciona estado --</option>
                <option value="PROGRAMADO" th:selected="${vuelo.estado=='PROGRAMADO'}">PROGRAMADO</option>
                <option value="EN_VUELO" th:selected="${vuelo.estado=='EN_VUELO'}">EN VUELO</option>
                <option value="FINALIZADO" th:selected="${vuelo.estado=='FINALIZADO'}">FINALIZADO</option>
                <option value="CANCELADO" th:selected="${vuelo.estado=='CANCELADO'}">CANCELADO</option>
            </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/web/vuelos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
